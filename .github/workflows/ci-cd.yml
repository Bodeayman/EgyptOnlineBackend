name: EgyptOnline CI/CD

on:
  push:
    branches: [ "master", "feature/contracts" ]
  pull_request:
    branches: [ "master", "feature/contracts" ]

env:
  DOTNET_VERSION: '9.0.x'
  POSTGRES_DB: egyptonline_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_db_pass_999' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Unit Tests (no database, runs fast)
  # ────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore EgyptOnline.Tests.Unit/EgyptOnline.Tests.Unit.csproj
        working-directory: ${{ github.workspace }}

      - name: Build unit test project
        run: dotnet build EgyptOnline.Tests.Unit/EgyptOnline.Tests.Unit.csproj --no-restore --configuration Release
        working-directory: ${{ github.workspace }}

      - name: Run unit tests
        run: |
          dotnet test EgyptOnline.Tests.Unit/EgyptOnline.Tests.Unit.csproj \
            --no-build \
            --configuration Release \
            --filter "Category=Unit" \
            --logger "trx;LogFileName=unit-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Unit
        working-directory: ${{ github.workspace }}

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults/Unit/**

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Integration Tests (real PostgreSQL)
  # ────────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore EgyptOnline.Tests.Integration/EgyptOnline.Tests.Integration.csproj
        working-directory: ${{ github.workspace }}

      - name: Build integration test project
        run: dotnet build EgyptOnline.Tests.Integration/EgyptOnline.Tests.Integration.csproj --no-restore --configuration Release
        working-directory: ${{ github.workspace }}

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U ${{ env.POSTGRES_USER }} && break
            echo "Waiting for PostgreSQL... attempt $i"
            sleep 2
          done

      - name: Run integration tests
        env:
          TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=${{ env.POSTGRES_DB }};Username=${{ env.POSTGRES_USER }};Password=${{ env.POSTGRES_PASSWORD }}"
        run: |
          dotnet test EgyptOnline.Tests.Integration/EgyptOnline.Tests.Integration.csproj \
            --no-build \
            --configuration Release \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=integration-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults/Integration
        working-directory: ${{ github.workspace }}

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: TestResults/Integration/**

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build & Deploy (depends on Unit and Integration tests passing)
  # ────────────────────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    # Only run deploy on actual pushes to target branches (not on pull requests)
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test TCP connection to VPS
        run: |
          timeout 10 bash -c "</dev/tcp/${{ secrets.SERVER_HOST }}/22"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore EgyptOnline.csproj

      - name: Build project
        run: dotnet build EgyptOnline.csproj --no-restore --configuration Release

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build --no-cache -t bodeayman/egypt_online_ma3ak:latest .

      - name: Push Docker image to registry
        run: docker push bodeayman/egypt_online_ma3ak:latest

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/egyptonlinema3ak
            sudo ./deploy.sh

      - name: Health check endpoints
        run: |
          sleep 15
          curl -f https://egyptonlinema3ak.com/health
